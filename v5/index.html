.menu-section{background:var(--surface)}.section-head{max-width:760px}.menu-controls{display:flex;gap:8px;flex-wrap:wrap;margin:39px 0 26px}.filter{border:1px solid var(--border);background:transparent;color:var(--ink);padding:12px 19px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.menu-card{background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;min-width:0}.menu-card[hidden]{display:none}.menu-card figure{margin:0;aspect-ratio:1/1.03;overflow:hidden;background:var(--cream)}.menu-card img{transition:transform .5s}.menu-card:hover img{transform:scale(1.07)}.menu-card-body{padding:21px 20px 22px;display:flex;flex-direction:column;flex:1}.menu-card .eyebrow{font-size:.6rem}.menu-card h3{font:normal 1.55rem/1.15 Georgia,serif;letter-spacing:-.035em;margin:13px 0 7px}.menu-card p{margin:0;color:var(--muted);line-height:1.55;font-size:.82rem;flex:1}.price{margin-top:19px;padding-top:13px;border-top:1px solid var(--border);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.menu-foot{font-size:.72rem;color:var(--muted);margin-top:20px}

const categories=['coffee','coffee','coffee','bakes','kitchen','coffee','bakes','bakes'];
const prices=['RWF 3,500','RWF 5,500','RWF 5,000','RWF 4,500','RWF 9,500','RWF 5,000','RWF 6,500','RWF 6,000'];
const langSelect=document.getElementById('language');let lang='en';let category='all';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.en[k]||k}
function renderMenu(){const grid=document.getElementById('menuGrid');grid.replaceChildren();for(let n=1;n<=8;n++){const card=document.createElement('article');card.className='menu-card reveal in';card.dataset.category=categories[n-1];card.hidden=category!=='all'&&category!==card.dataset.category;const fig=document.createElement('figure');const img=document.createElement('img');img.src=photos[n-1];img.alt=t('item'+n);img.loading='lazy';fig.append(img);const body=document.createElement('div');body.className='menu-card-body';const label=document.createElement('span');label.className='eyebrow';label.textContent=t('tab'+({coffee:'Coffee',kitchen:'Kitchen',bakes:'Bakes'}[categories[n-1]]));const heading=document.createElement('h3');heading.textContent=t('item'+n);const desc=document.createElement('p');desc.textContent=t('desc'+n);const price=document.createElement('div');price.className='price';price.textContent=t('priceFrom')+' '+prices[n-1];body.append(label,heading,desc,price);card.append(fig,body);grid.append(card)}}
function renderPair(){const box=document.getElementById('pairResult');if(box.hidden)return;const pace=document.querySelector('input[name="pace"]:checked').value;document.getElementById('pairName').textContent=t('pair'+pace);document.getElementById('pairDescription').textContent=t('pairDesc'+pace)}
function setLanguage(code){lang=I18N[code]?code:'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';langSelect.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.getElementById('theme').setAttribute('aria-label',t('themeLabel'));document.getElementById('menuToggle').setAttribute('aria-label',document.getElementById('nav').classList.contains('open')?t('closeMenu'):t('menuLabel'));document.getElementById('toTop').setAttribute('aria-label',t('top'));langSelect.setAttribute('aria-label',t('langLabel'));renderMenu();renderPair()}
const detected=(navigator.language||'en').toLowerCase().split('-')[0];setLanguage(detected);langSelect.addEventListener('change',e=>setLanguage(e.target.value));
const theme=document.getElementById('theme');function syncTheme(){theme.textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}syncTheme();theme.addEventListener('click',()=>{const value=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=value;try{localStorage.setItem('soko-theme',value)}catch(e){}syncTheme()});
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{category=btn.dataset.category;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));document.querySelectorAll('.menu-card').forEach(card=>card.hidden=category!=='all'&&category!==card.dataset.category)}));
document.getElementById('pairButton').addEventListener('click',()=>{document.getElementById('pairResult').hidden=false;renderPair()});document.querySelectorAll('input[name="pace"]').forEach(input=>input.addEventListener('change',renderPair));
const toggle=document.getElementById('menuToggle'),nav=document.getElementById('nav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',t(open?'closeMenu':'menuLabel'));toggle.textContent=open?'×':'☰'});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label',t('menuLabel'));toggle.textContent='☰'}));
const topBtn=document.getElementById('toTop');function onScroll(){topBtn.classList.toggle('visible',scrollY>700)}addEventListener('scroll',onScroll,{passive:true});onScroll();topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');observer.unobserve(entry.target)}})},{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
})();
</script>
